name: Package Windows

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: npm --prefix fe install

      - name: Use SQLite schema for USB package
        shell: pwsh
        run: |
          $schema = "be/prisma/schema.prisma"
          (Get-Content $schema) `
            -replace 'provider\s*=\s*"mysql"', 'provider = "sqlite"' |
            Set-Content $schema
          Select-String -Path $schema -Pattern 'provider\s*='

      - name: Create backend .env for prisma generate
        shell: pwsh
        run: |
          @"
          DATABASE_URL="file:./dev.db"
          USB_ROOT="usb-dev"
          DATABASE_PATH="usb-dev/data/database.sqlite"
          JWT_SECRET="ci-build-secret-not-for-runtime"
          PORT=3001
          CORS_ORIGINS="http://localhost:8080"
          NODE_ENV="production"
          "@ | Set-Content -Path "be/.env" -Encoding utf8

      - name: Build frontend
        run: npm run build:fe

      - name: Stage backend (lean, no Puppeteer)
        shell: pwsh
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
          DATABASE_URL: "file:./dev.db"
        run: node scripts/stage-packaged-backend.js

      - name: Assemble portable Windows app
        shell: pwsh
        env:
          DATABASE_URL: "file:./dev.db"
        run: node scripts/assemble-win-portable.js

      - name: Verify package layout
        shell: pwsh
        run: |
          $root = "out/T. A. TEX-win32-x64"
          foreach ($path in @(
            "$root/TATex.exe",
            "$root/resources/app/electron/main.js",
            "$root/resources/app/fe/dist/index.html",
            "$root/resources/backend/index.js",
            "$root/resources/backend/node_modules/@prisma/client",
            "$root/resources/backend/node_modules/.prisma/client",
            "$root/resources/node/node.exe"
          )) {
            if (-not (Test-Path $path)) { throw "Missing required path: $path" }
          }
          if (Test-Path "$root/resources/backend/node_modules/puppeteer") {
            throw "puppeteer should not be bundled"
          }
          Get-ChildItem $root | Format-Table Name, Length

      # upload-artifact v4 omits hidden files by default — that drops
      # node_modules/.prisma and breaks @prisma/client at runtime.
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TATex-win32-x64
          path: out/T. A. TEX-win32-x64
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
